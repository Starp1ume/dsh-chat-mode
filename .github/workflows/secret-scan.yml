# 发布前 secret 扫描：push / PR / merge queue 时检查仓库与 git 历史。
# 只做静态检查，不读取、不构造任何真实凭证；命中即失败。
#
# 注意：本工作流只能“在 PR 合入前挡住”，不能撤销已经发生的 push。
# 真实保护范围见 README「开发与发布自查」。
# 要让它在合入前生效：仓库 Settings → Rules → Rulesets，对 main 启用
# “Require status checks to pass before merging”，并把 `secret-scan` 加为必需检查。
name: secret-scan

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（完整历史，供 --history 使用）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 扫描 git 跟踪文件
        run: node scripts/scan-secrets.mjs

      - name: 扫描 git 历史新增行与危险文件名
        run: node scripts/scan-secrets.mjs --history
